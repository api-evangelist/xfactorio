aid: xfactorio
name: Xfactor.io
description: >-
  Xfactor.io is an AI-powered revenue operations platform founded by Mike
  Carpenter and backed by Accel and Lightspeed Venture Partners. Its Growth AI
  engine, together with the Xfactor Central, OpenInsights, and Simulation
  products, builds a live digital twin of a company's go-to-market operations
  — connecting CRM, pipeline, usage, and financial data so revenue teams can
  test decisions through simulation before rolling them out. The platform is
  delivered as a closed B2B SaaS application (app.xfactor.io) and does not
  publish a public API, developer portal, or client SDKs; security posture is
  documented on a Secureframe trust center with a SOC 2 Type II attestation.
